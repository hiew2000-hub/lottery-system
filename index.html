<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>完美即时抽签 - 不重复，保证配对</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 500px;
            padding: 30px;
            text-align: center;
        }
        h1 {
            color: #333;
            margin-bottom: 20px;
            font-size: 24px;
        }
        
        /* 系统状态 */
        .system-status {
            background: #f1f8ff;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            border: 2px solid #667eea;
        }
        .status-item {
            display: flex;
            justify-content: space-between;
            margin: 8px 0;
            font-size: 15px;
        }
        .status-label {
            color: #666;
        }
        .status-value {
            font-weight: bold;
            color: #667eea;
        }
        .status-warning {
            color: #ff6b6b;
            font-size: 13px;
            margin-top: 10px;
        }
        
        /* 名字选择 */
        .name-selection {
            margin: 20px 0;
        }
        .name-tag {
            display: inline-block;
            background: #667eea;
            color: white;
            padding: 12px 24px;
            margin: 8px;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 16px;
            min-width: 100px;
            position: relative;
        }
        .name-tag:hover {
            background: #764ba2;
            transform: scale(1.05);
        }
        .name-tag.selected {
            background: #ff6b6b;
            transform: scale(1.1);
            box-shadow: 0 0 20px rgba(255, 107, 107, 0.4);
        }
        .name-tag.taken {
            background: #95a5a6;
            cursor: not-allowed;
            opacity: 0.7;
        }
        .name-tag.taken:after {
            content: "✓";
            position: absolute;
            right: 10px;
            font-weight: bold;
        }
        .name-tag.available {
            background: #51cf66;
            animation: pulse 2s infinite;
        }
        
        /* 轮盘 */
        .wheel-container {
            position: relative;
            width: 300px;
            height: 300px;
            margin: 20px auto;
            display: none;
        }
        #wheel {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: conic-gradient(
                #ff6b6b 0deg 90deg,
                #ffd93d 90deg 180deg,
                #6bcf7f 180deg 270deg,
                #4d96ff 270deg 360deg
            );
            transition: transform 3s cubic-bezier(0.2, 0.8, 0.3, 1);
            cursor: pointer;
            position: relative;
        }
        .wheel-center {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 60px;
            height: 60px;
            background: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            border: 4px solid #667eea;
            box-shadow: 0 0 15px rgba(0,0,0,0.2);
        }
        .pointer {
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 20px solid transparent;
            border-right: 20px solid transparent;
            border-top: 30px solid #ff6b6b;
            z-index: 2;
        }
        
        /* 结果 */
        .result-box {
            margin: 25px 0;
            padding: 25px;
            background: linear-gradient(135deg, #f6d365, #fda085);
            border-radius: 15px;
            border: 4px solid #ff6b6b;
            min-height: 180px;
            display: none;
            color: white;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.2);
        }
        .result-title {
            font-size: 22px;
            margin-bottom: 15px;
            font-weight: bold;
        }
        .result-pair {
            font-size: 42px;
            font-weight: bold;
            margin: 15px 0;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
        }
        .result-arrow {
            font-size: 32px;
            animation: bounce 1s infinite;
        }
        .result-from {
            color: #2d3436;
            background: white;
            padding: 5px 20px;
            border-radius: 25px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        .result-to {
            color: #ff6b6b;
            background: white;
            padding: 5px 20px;
            border-radius: 25px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        .result-note {
            font-size: 14px;
            margin-top: 15px;
            opacity: 0.9;
        }
        
        /* 按钮 */
        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 18px;
            border-radius: 50px;
            cursor: pointer;
            margin: 10px;
            transition: all 0.3s;
            font-weight: bold;
            display: inline-block;
            min-width: 200px;
        }
        .btn:hover { 
            transform: translateY(-3px); 
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3); 
        }
        .btn:disabled { 
            background: #ccc; 
            cursor: not-allowed; 
            transform: none;
            box-shadow: none;
        }
        .btn-success {
            background: linear-gradient(135deg, #00b09b, #96c93d);
        }
        .btn-warning {
            background: linear-gradient(135deg, #ff9a00, #ff6b6b);
        }
        
        /* 动画 */
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
        
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }
        
        .hidden { display: none !important; }
        
        /* 烟花 */
        .firework {
            position: fixed;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            pointer-events: none;
            z-index: 1000;
        }
        
        /* 配对图 */
        .pairing-map {
            margin: 20px 0;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 10px;
            display: none;
        }
        .pair-line {
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 10px 0;
            gap: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎯 完美即时抽签系统</h1>
        
        <!-- 系统状态 -->
        <div class="system-status">
            <div class="status-item">
                <span class="status-label">总人数：</span>
                <span class="status-value" id="totalCount">7</span>
            </div>
            <div class="status-item">
                <span class="status-label">已抽签：</span>
                <span class="status-value" id="drawnCount">0</span>
            </div>
            <div class="status-item">
                <span class="status-label">剩余可抽：</span>
                <span class="status-value" id="availableCount">7</span>
            </div>
            <div class="status-warning" id="systemWarning">
                ⚠️ 系统将自动预留名额，确保最后一人也有选择
            </div>
        </div>
        
        <!-- 第一步：选择名字 -->
        <div id="step1">
            <h3>第一步：选择你的名字</h3>
            <p style="color: #666; margin-bottom: 15px;">
                请从下方选择你的名字开始抽签
            </p>
            
            <div class="name-selection" id="nameSelection">
                <!-- 动态生成 -->
            </div>
            
            <button class="btn" onclick="confirmSelection()" id="confirmBtn" disabled>
                ✅ 确认并开始抽签
            </button>
        </div>
        
        <!-- 第二步：抽签 -->
        <div id="step2" class="hidden">
            <h3>第二步：开始抽签</h3>
            <p style="color: #666; margin-bottom: 15px;">
                点击转盘开始抽签，系统确保不会重复
            </p>
            
            <div class="wheel-container" id="wheelContainer">
                <div class="pointer"></div>
                <div id="wheel" onclick="startSpin()">
                    <div class="wheel-center">点击抽签</div>
                </div>
            </div>
            
            <button class="btn" onclick="startSpin()" id="spinBtn">
                🎲 开始抽签
            </button>
        </div>
        
        <!-- 第三步：结果 -->
        <div id="step3" class="hidden">
            <h3>第三步：抽签结果</h3>
            
            <div class="result-box" id="resultBox">
                <div class="result-title">🎁 你的配对结果</div>
                <div class="result-pair" id="resultPair">
                    <!-- 动态生成 -->
                </div>
                <div class="result-note" id="resultNote">
                    ✅ 配对完成！请为此人准备礼物
                </div>
            </div>
            
            <button class="btn btn-success" onclick="saveResult()" id="saveBtn">
                💾 保存结果
            </button>
            <button class="btn" onclick="resetForNext()" id="nextBtn">
                🔄 下一个人抽签
            </button>
        </div>
        
        <!-- 管理员面板 -->
        <div style="margin-top: 30px; padding-top: 20px; border-top: 1px solid #eee;">
            <button class="btn btn-warning" onclick="showAdminPanel()">
                ⚙️ 管理员查看
            </button>
            <button class="btn" onclick="showPairingMap()" id="mapBtn" disabled>
                🗺️ 查看配对图
            </button>
        </div>
        
        <!-- 配对图 -->
        <div class="pairing-map" id="pairingMap">
            <h3>🗺️ 当前配对关系图</h3>
            <div id="pairingLines">
                <!-- 动态生成 -->
            </div>
            <button class="btn" onclick="hidePairingMap()" style="margin-top: 10px;">
                隐藏图表
            </button>
        </div>
        
        <!-- 使用说明 -->
        <div style="margin-top: 30px; color: #666; font-size: 14px; text-align: left; padding: 15px; background: #f8f9fa; border-radius: 10px;">
            <strong>🎯 系统保证：</strong>
            <p>1. ✅ 即时抽签，不用等待</p>
            <p>2. ✅ 不允许重复，每人只能被抽一次</p>
            <p>3. ✅ 保证完整配对，最后一人也有选择</p>
            <p>4. ✅ 马上知道结果，无需注册</p>
        </div>
    </div>

    <script>
        // ============ 配置 ============
        const ALL_NAMES = [
            "qiu", "jianhui", "peggie", "jiaxin", 
            "siowyao", "jingru", "xueyong"
        ];
        
        // ============ 变量 ============
        let currentUser = "";              // 当前抽签人
        let currentPair = null;            // 当前配对结果
        let allPairs = new Map();          // 所有配对结果 Map(抽签人 → 被抽人)
        let takenNames = new Set();        // 已被抽中的人
        let availablePool = [];           // 当前可抽取的池子
        
        // ============ 初始化 ============
        window.onload = function() {
            loadData();
            updateStatus();
            renderNameSelection();
        };
        
        function loadData() {
            const saved = JSON.parse(localStorage.getItem('perfectPairs') || '{}');
            allPairs = new Map(Object.entries(saved));
            
            // 更新已被抽中的人
            takenNames = new Set(Array.from(allPairs.values()));
            
            console.log("已加载配对:", allPairs);
            console.log("已被抽中:", takenNames);
        }
        
        function saveData() {
            const obj = Object.fromEntries(allPairs);
            localStorage.setItem('perfectPairs', JSON.stringify(obj));
        }
        
        // 更新系统状态
        function updateStatus() {
            document.getElementById('totalCount').textContent = ALL_NAMES.length;
            document.getElementById('drawnCount').textContent = allPairs.size;
            document.getElementById('availableCount').textContent = ALL_NAMES.length - allPairs.size;
            
            // 更新配对图按钮状态
            document.getElementById('mapBtn').disabled = allPairs.size === 0;
        }
        
        // 渲染名字选择
        function renderNameSelection() {
            const container = document.getElementById('nameSelection');
            container.innerHTML = '';
            
            ALL_NAMES.forEach(name => {
                const tag = document.createElement('div');
                tag.className = 'name-tag';
                tag.textContent = name;
                
                // 检查是否已抽过签
                if (allPairs.has(name)) {
                    tag.classList.add('taken');
                    tag.title = `${name} 已抽过签`;
                } else if (takenNames.has(name)) {
                    tag.classList.add('taken');
                    tag.title = `${name} 已被别人抽中`;
                } else {
                    tag.onclick = () => selectName(name, tag);
                    tag.classList.add('available');
                }
                
                container.appendChild(tag);
            });
            
            // 如果没有可抽的人了
            if (allPairs.size === ALL_NAMES.length) {
                container.innerHTML = '<p style="color:#00b09b; padding:20px; font-size:18px;">🎉 所有人已完成抽签！</p>';
            }
        }
        
        // 选择名字
        function selectName(name, element) {
            // 如果已抽过或被抽中，不能选择
            if (allPairs.has(name) || takenNames.has(name)) {
                return;
            }
            
            // 移除其他选择
            document.querySelectorAll('.name-tag').forEach(tag => {
                tag.classList.remove('selected');
            });
            
            // 标记当前选择
            element.classList.add('selected');
            currentUser = name;
            
            // 启用确认按钮
            document.getElementById('confirmBtn').disabled = false;
        }
        
        // 确认选择
        function confirmSelection() {
            if (!currentUser) {
                alert("请先选择你的名字！");
                return;
            }
            
            // 切换到第二步
            document.getElementById('step1').classList.add('hidden');
            document.getElementById('step2').classList.remove('hidden');
            document.getElementById('wheelContainer').style.display = 'block';
            
            // 准备可抽取池子
            prepareAvailablePool();
        }
        
        // 准备可抽取池子（核心算法！）
        function prepareAvailablePool() {
            // 1. 先排除自己
            let candidates = ALL_NAMES.filter(name => name !== currentUser);
            
            // 2. 排除已被抽中的人
            candidates = candidates.filter(name => !takenNames.has(name));
            
            // 3. 计算还需要多少人会被抽中
            const remainingToBeDrawn = ALL_NAMES.length - takenNames.size - 1;
            
            // 4. 确保给后面的人留名额
            if (remainingToBeDrawn > 0) {
                // 需要保留一些名额给后面的人
                const needToReserve = Math.min(remainingToBeDrawn, candidates.length - 1);
                
                if (needToReserve > 0) {
                    // 从候选中随机保留一些
                    const shuffled = [...candidates].sort(() => Math.random() - 0.5);
                    availablePool = shuffled.slice(0, shuffled.length - needToReserve);
                } else {
                    availablePool = candidates;
                }
            } else {
                // 最后一个抽签的人，可以从已被抽中的人里选
                availablePool = candidates.length > 0 ? candidates : 
                    Array.from(takenNames).filter(name => name !== currentUser);
            }
            
            console.log("可抽取池子:", availablePool);
            console.log("当前用户:", currentUser);
            console.log("已被抽中:", Array.from(takenNames));
        }
        
        // 开始抽签
        function startSpin() {
            if (availablePool.length === 0) {
                alert("系统错误：没有可抽取的人员！");
                return;
            }
            
            const wheel = document.getElementById('wheel');
            const spinBtn = document.getElementById('spinBtn');
            
            // 禁用按钮，开始动画
            spinBtn.disabled = true;
            spinBtn.textContent = '配对中...';
            
            // 转盘旋转
            wheel.style.transform = 'rotate(1080deg)';
            
            // 3秒后显示结果
            setTimeout(() => {
                // 从可用池子中随机选择
                const randomIndex = Math.floor(Math.random() * availablePool.length);
                const selected = availablePool[randomIndex];
                
                currentPair = {
                    from: currentUser,
                    to: selected
                };
                
                // 显示结果
                showResult();
                
                // 更新按钮
                spinBtn.textContent = '开始抽签';
                spinBtn.disabled = false;
                
            }, 3000);
        }
        
        // 显示结果
        function showResult() {
            // 切换到第三步
            document.getElementById('step2').classList.add('hidden');
            document.getElementById('step3').classList.remove('hidden');
            
            // 显示结果框
            document.getElementById('resultBox').style.display = 'block';
            
            // 显示配对结果
            document.getElementById('resultPair').innerHTML = `
                <div class="result-from">${currentPair.from}</div>
                <div class="result-arrow">🎯 ➜ 🎁</div>
                <div class="result-to">${currentPair.to}</div>
            `;
            
            // 检查是否是互相配对
            if (allPairs.has(currentPair.to) && allPairs.get(currentPair.to) === currentPair.from) {
                document.getElementById('resultNote').innerHTML = 
                    '✨ 惊喜！你们互相配对了！';
            }
            
            createFireworks();
        }
        
        // 保存结果
        function saveResult() {
            if (!currentPair) {
                alert("请先完成抽签！");
                return;
            }
            
            // 保存配对结果
            allPairs.set(currentPair.from, currentPair.to);
            takenNames.add(currentPair.to);
            
            // 保存到本地存储
            saveData();
            
            // 更新状态
            updateStatus();
            
            // 显示成功消息
            alert(`✅ 配对已保存！\n\n${currentPair.from} → ${currentPair.to}`);
            
            // 检查是否所有人都完成了
            if (allPairs.size === ALL_NAMES.length) {
                document.getElementById('resultNote').innerHTML += 
                    '<br><br>🎉 <strong>所有人已完成配对！</strong>';
            }
            
            // 启用保存按钮
            document.getElementById('saveBtn').classList.add('hidden');
        }
        
        // 下一个人抽签
        function resetForNext() {
            // 重置变量
            currentUser = "";
            currentPair = null;
            
            // 重置界面
            document.getElementById('step1').classList.remove('hidden');
            document.getElementById('step2').classList.add('hidden');
            document.getElementById('step3').classList.add('hidden');
            
            document.getElementById('wheelContainer').style.display = 'none';
            document.getElementById('resultBox').style.display = 'none';
            document.getElementById('saveBtn').classList.remove('hidden');
            
            // 重置轮盘
            document.getElementById('wheel').style.transform = 'rotate(0deg)';
            
            // 重置选择
            document.querySelectorAll('.name-tag').forEach(tag => {
                tag.classList.remove('selected');
            });
            document.getElementById('confirmBtn').disabled = true;
            
            // 重新渲染名字选择
            renderNameSelection();
            
            // 显示提示
            if (allPairs.size < ALL_NAMES.length) {
                alert("🔄 请下一位选择名字开始抽签！");
            }
        }
        
        // ============ 管理员功能 ============
        function showAdminPanel() {
            const pairs = Array.from(allPairs.entries());
            
            if (pairs.length === 0) {
                alert("暂无配对数据");
                return;
            }
            
            let message = "📋 完整配对结果：\n\n";
            
            // 统计互相配对
            let mutualPairs = [];
            let singlePairs = [];
            
            pairs.forEach(([from, to]) => {
                if (allPairs.get(to) === from) {
                    // 互相配对
                    if (!mutualPairs.some(p => p.includes(from) && p.includes(to))) {
                        mutualPairs.push([from, to]);
                    }
                } else {
                    // 单向配对
                    singlePairs.push([from, to]);
                }
            });
            
            // 显示互相配对
            if (mutualPairs.length > 0) {
                message += "🤝 互相配对：\n";
                mutualPairs.forEach(([a, b]) => {
                    message += `  ${a} ↔ ${b}\n`;
                });
                message += "\n";
            }
            
            // 显示单向配对
            if (singlePairs.length > 0) {
                message += "🎯 单向配对：\n";
                singlePairs.forEach(([from, to]) => {
                    message += `  ${from} → ${to}\n`;
                });
            }
            
            // 显示统计
            message += `\n📊 统计：\n`;
            message += `总配对：${pairs.length} / ${ALL_NAMES.length}\n`;
            message += `互相配对：${mutualPairs.length} 对\n`;
            message += `完成进度：${Math.round((pairs.length / ALL_NAMES.length) * 100)}%`;
            
            if (pairs.length === ALL_NAMES.length) {
                message += "\n\n🎉 所有人已完成配对！";
            }
            
            alert(message);
        }
        
        // 显示配对图
        function showPairingMap() {
            const container = document.getElementById('pairingLines');
            container.innerHTML = '';
            
            const pairs = Array.from(allPairs.entries());
            
            if (pairs.length === 0) {
                container.innerHTML = '<p style="color:#666;">暂无配对数据</p>';
            } else {
                pairs.forEach(([from, to]) => {
                    const line = document.createElement('div');
                    line.className = 'pair-line';
                    
                    // 检查是否是互相配对
                    const isMutual = allPairs.get(to) === from;
                    
                    line.innerHTML = `
                        <div style="background:#667eea; color:white; padding:5px 15px; border-radius:15px;">
                            ${from}
                        </div>
                        <div style="font-size:20px; color:${isMutual ? '#00b09b' : '#666'}">
                            ${isMutual ? '↔' : '→'}
                        </div>
                        <div style="background:#${isMutual ? '00b09b' : 'ff6b6b'}; color:white; padding:5px 15px; border-radius:15px;">
                            ${to}
                        </div>
                    `;
                    
                    container.appendChild(line);
                });
            }
            
            document.getElementById('pairingMap').style.display = 'block';
        }
        
        function hidePairingMap() {
            document.getElementById('pairingMap').style.display = 'none';
        }
        
        // ============ 特效 ============
        function createFireworks() {
            const colors = ['#ff6b6b', '#4d96ff', '#6bcf7f', '#ffd93d'];
            for (let i = 0; i < 12; i++) {
                setTimeout(() => {
                    const firework = document.createElement('div');
                    firework.className = 'firework';
                    firework.style.left = Math.random() * 100 + 'vw';
                    firework.style.top = Math.random() * 100 + 'vh';
                    firework.style.background = colors[Math.floor(Math.random() * colors.length)];
                    
                    document.body.appendChild(firework);
                    
                    firework.animate([
                        { opacity: 0, transform: 'scale(0)' },
                        { opacity: 1, transform: 'scale(1.5)' },
                        { opacity: 0, transform: 'scale(0)' }
                    ], { duration: 800 });
                    
                    setTimeout(() => firework.remove(), 800);
                }, i * 100);
            }
        }
        
        // 添加键盘快捷键
        document.addEventListener('keydown', function(e) {
            // F5 刷新状态
            if (e.key === 'F5') {
                e.preventDefault();
                updateStatus();
                renderNameSelection();
                alert("状态已刷新！");
            }
            
            // Ctrl+R 重置（管理员用）
            if (e.ctrlKey && e.key === 'r') {
                if (confirm("确定重置所有数据吗？")) {
                    localStorage.removeItem('perfectPairs');
                    allPairs.clear();
                    takenNames.clear();
                    updateStatus();
                    renderNameSelection();
                    resetForNext();
                    alert("✅ 系统已重置！");
                }
                e.preventDefault();
            }
        });
    </script>
</body>
</html>
