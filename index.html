<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>远程保密抽签系统</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 500px;
            padding: 30px;
            text-align: center;
        }
        h1 {
            color: #333;
            margin-bottom: 20px;
            font-size: 24px;
        }
        .wheel-container {
            position: relative;
            width: 250px;
            height: 250px;
            margin: 20px auto;
        }
        #wheel {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: conic-gradient(
                #ff7676 0deg 90deg,
                #ffeaa7 90deg 180deg,
                #55efc4 180deg 270deg,
                #74b9ff 270deg 360deg
            );
            transition: transform 3s cubic-bezier(0.2, 0.8, 0.3, 1);
            cursor: pointer;
            position: relative;
        }
        .wheel-center {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 50px;
            height: 50px;
            background: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            border: 3px solid #6a11cb;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        .pointer {
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 15px solid transparent;
            border-right: 15px solid transparent;
            border-top: 25px solid #ff4757;
            z-index: 2;
        }
        #result {
            margin: 25px 0;
            min-height: 80px;
        }
        #resultText {
            font-size: 28px;
            font-weight: bold;
            color: #2d3436;
            margin: 15px 0;
            min-height: 50px;
        }
        button {
            background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 16px;
            border-radius: 50px;
            cursor: pointer;
            margin: 8px;
            transition: all 0.3s;
        }
        button:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(106, 17, 203, 0.3); }
        button:disabled { background: #ccc; cursor: not-allowed; }
        .admin-btn { background: #ff4757; }
        .reset-panel {
            display: none;
            margin-top: 20px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 10px;
            border: 1px solid #ddd;
        }
        .count-display {
            font-size: 18px;
            color: #6a11cb;
            font-weight: bold;
            margin: 15px 0;
        }
        .instructions {
            margin-top: 25px;
            padding: 15px;
            background: #f1f8ff;
            border-radius: 10px;
            font-size: 14px;
            color: #555;
            text-align: left;
        }
        .firework {
            position: fixed;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            pointer-events: none;
            z-index: 1000;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎯 远程保密抽签系统</h1>
        
        <div class="wheel-container">
            <div class="pointer"></div>
            <div id="wheel" onclick="startSpin()">
                <div class="wheel-center">抽签</div>
            </div>
        </div>
        
        <div class="count-display">
            剩余名额：<span id="count">加载中...</span>
        </div>
        
        <div id="result">
            <div style="color: #777; font-size: 14px;">
                点击转盘开始抽签
            </div>
            <div id="resultText"></div>
        </div>
        
        <div>
            <button onclick="startSpin()" id="spinBtn">开始抽签</button>
            <button onclick="resetForNewUser()" id="newUserBtn">下一位抽签</button>
        </div>
        
        <button onclick="showResetPanel()" class="admin-btn">
            🔧 管理员重置
        </button>
        
        <div id="resetPanel" class="reset-panel">
            <h3 style="color: #ff4757; margin-bottom: 10px;">系统重置</h3>
            <p style="margin-bottom: 10px;">输入密码：admin123</p>
            <input type="password" id="resetPassword" 
                   style="padding: 8px; width: 180px; border: 2px solid #6a11cb; border-radius: 5px;">
            <div style="margin-top: 10px;">
                <button onclick="manualReset()" style="background: #ff4757;">确认重置</button>
                <button onclick="hideResetPanel()" style="background: #95a5a6;">取消</button>
            </div>
        </div>
        
        <div class="instructions">
            <strong>使用说明：</strong>
            <p>1. 每人只能抽一次，抽完自动关闭</p>
            <p>2. 已抽名字自动删除，下个人看不到</p>
            <p>3. 抽完请关闭页面，让下一位抽签</p>
            <p>4. 管理员可重置系统重新开始</p>
        </div>
    </div>

    <script>
        // ============ 名字列表 - 在这里修改！ ============
        // 把你的名字替换下面的名字，格式："名字1", "名字2", ...
        const defaultNames = [
            "jh", "stella", "sam", "qiu", 
            "peggie", "JIAXIN", "Siow Yao", "Xueyong"
        ];
        // ==============================================
        
        let names = [];
        let hasDrawn = false;
        
        // 初始化
        window.onload = function() {
            initNames();
            updateRemainingCount();
        };
        
        function initNames() {
            const savedNames = localStorage.getItem('lotteryNames');
            const drawnNames = JSON.parse(localStorage.getItem('drawnNames') || '[]');
            
            if (!savedNames) {
                names = [...defaultNames];
                localStorage.setItem('lotteryNames', JSON.stringify(names));
                localStorage.setItem('drawnNames', JSON.stringify([]));
            } else {
                const allNames = JSON.parse(savedNames);
                names = allNames.filter(name => !drawnNames.includes(name));
            }
        }
        
        function updateRemainingCount() {
            document.getElementById('count').textContent = names.length;
        }
        
        function startSpin() {
            if (hasDrawn) {
                alert("您已经抽过签了！请让下一位抽签。");
                return;
            }
            
            if (names.length === 0) {
                document.getElementById('resultText').innerHTML = 
                    '<span style="color:#ff4757;">🎉 所有名额已抽完！</span>';
                return;
            }
            
            const wheel = document.getElementById('wheel');
            const spinBtn = document.getElementById('spinBtn');
            
            // 禁用按钮，开始动画
            spinBtn.disabled = true;
            spinBtn.textContent = '抽签中...';
            
            // 转盘旋转
            wheel.style.transform = 'rotate(1080deg)';
            
            // 3秒后显示结果
            setTimeout(() => {
                const randomIndex = Math.floor(Math.random() * names.length);
                const selectedName = names[randomIndex];
                
                // 显示结果
                document.getElementById('resultText').innerHTML = `
                    <div style="color:#2d3436; font-size:20px; margin-bottom:8px;">
                        恭喜抽到：
                    </div>
                    <div style="font-size:42px; color:#ff4757; font-weight:bold;">
                        ${selectedName}
                    </div>
                `;
                
                // 从池中移除
                names.splice(randomIndex, 1);
                
                // 保存记录
                const drawnNames = JSON.parse(localStorage.getItem('drawnNames') || '[]');
                drawnNames.push(selectedName);
                localStorage.setItem('drawnNames', JSON.stringify(drawnNames));
                localStorage.setItem('lotteryNames', JSON.stringify(names));
                
                // 更新状态
                hasDrawn = true;
                spinBtn.textContent = '已抽签';
                spinBtn.style.background = '#ccc';
                
                updateRemainingCount();
                createFireworks();
                
                // 5秒后提示关闭
                setTimeout(() => {
                    alert("✅ 抽签完成！请关闭页面让下一位抽签。");
                }, 2000);
                
            }, 3000);
        }
        
        function resetForNewUser() {
            hasDrawn = false;
            const spinBtn = document.getElementById('spinBtn');
            spinBtn.disabled = false;
            spinBtn.textContent = '开始抽签';
            spinBtn.style.background = 'linear-gradient(135deg, #6a11cb 0%, #2575fc 100%)';
            document.getElementById('resultText').innerHTML = '';
            
            const wheel = document.getElementById('wheel');
            wheel.style.transform = 'rotate(0deg)';
            
            alert("🔄 已准备好，请开始抽签！");
        }
        
        // 重置功能
        function showResetPanel() {
            document.getElementById('resetPanel').style.display = 'block';
        }
        
        function hideResetPanel() {
            document.getElementById('resetPanel').style.display = 'none';
            document.getElementById('resetPassword').value = '';
        }
        
        function manualReset() {
            const password = document.getElementById('resetPassword').value;
            
            if (password === "admin123") {
                if (confirm("确定重置系统？所有记录将被清除！")) {
                    localStorage.removeItem('lotteryNames');
                    localStorage.removeItem('drawnNames');
                    
                    initNames();
                    updateRemainingCount();
                    hasDrawn = false;
                    
                    const spinBtn = document.getElementById('spinBtn');
                    spinBtn.disabled = false;
                    spinBtn.textContent = '开始抽签';
                    spinBtn.style.background = 'linear-gradient(135deg, #6a11cb 0%, #2575fc 100%)';
                    
                    document.getElementById('resultText').innerHTML = '';
                    
                    const wheel = document.getElementById('wheel');
                    wheel.style.transform = 'rotate(0deg)';
                    
                    alert("✅ 系统已重置！可以重新开始抽签。");
                    hideResetPanel();
                }
            } else {
                alert("❌ 密码错误！");
                document.getElementById('resetPassword').value = '';
            }
        }
        
        function createFireworks() {
            const colors = ['#ff4757', '#2ed573', '#1e90ff', '#ffa502'];
            for (let i = 0; i < 20; i++) {
                setTimeout(() => {
                    const firework = document.createElement('div');
                    firework.className = 'firework';
                    firework.style.left = Math.random() * 100 + 'vw';
                    firework.style.top = Math.random() * 100 + 'vh';
                    firework.style.background = colors[Math.floor(Math.random() * colors.length)];
                    
                    document.body.appendChild(firework);
                    
                    firework.animate([
                        { opacity: 0, transform: 'scale(0)' },
                        { opacity: 1, transform: 'scale(1.5)' },
                        { opacity: 0, transform: 'scale(0)' }
                    ], { duration: 800 });
                    
                    setTimeout(() => firework.remove(), 800);
                }, i * 100);
            }
        }
    </script>
</body>
</html>
