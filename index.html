<!DOCTYPE html>
<html>
<head>
    <title>避免自抽的抽签系统</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; padding: 20px; }
        .container { background: white; border-radius: 15px; padding: 30px; max-width: 600px; margin: 0 auto; }
        h1 { text-align: center; color: #333; margin-bottom: 20px; }
        .step { display: none; margin: 20px 0; }
        .step.active { display: block; }
        select, button { padding: 12px; font-size: 16px; margin: 10px 0; width: 100%; border-radius: 8px; }
        button { background: #667eea; color: white; border: none; cursor: pointer; }
        button:hover { background: #5a67d8; }
        #result { font-size: 24px; font-weight: bold; text-align: center; margin: 20px 0; min-height: 100px; }
        .name-tag { display: inline-block; background: #e9ecef; padding: 5px 15px; border-radius: 20px; margin: 5px; }
        .taken { background: #ff6b6b; color: white; }
        .available { background: #51cf66; color: white; }
        .current-user { background: #4dabf7; color: white; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎯 避免自抽的抽签系统</h1>
        
        <!-- 第一步：选择自己的名字 -->
        <div id="step1" class="step active">
            <h2>第一步：请选择你的名字</h2>
            <p>请从名单中选择你的名字：</p>
            <select id="userSelect">
                <option value="">-- 请选择你的名字 --</option>
                <!-- 名字会通过JavaScript动态添加 -->
            </select>
            <button onclick="selectUser()">确认身份</button>
        </div>
        
        <!-- 第二步：抽签 -->
        <div id="step2" class="step">
            <h2>第二步：开始抽签</h2>
            <p>你的身份：<span id="currentUser" class="name-tag"></span></p>
            <p>将从以下人员中随机抽取（已排除你自己）：</p>
            <div id="availableList"></div>
            <button onclick="startDraw()">🎲 开始抽签</button>
        </div>
        
        <!-- 第三步：显示结果 -->
        <div id="step3" class="step">
            <h2>第三步：抽签结果</h2>
            <div id="result"></div>
            <button onclick="resetForNext()">下一个人抽签</button>
            <button onclick="showAdminPanel()" style="background: #ff6b6b;">管理员重置</button>
        </div>
        
        <!-- 管理员面板 -->
        <div id="adminPanel" style="display:none; margin-top:20px; padding:15px; background:#f8f9fa; border-radius:10px;">
            <h3>管理员操作</h3>
            <p>输入密码重置系统：<input type="password" id="adminPassword"></p>
            <button onclick="resetSystem()">重置系统</button>
            <button onclick="hideAdminPanel()">取消</button>
        </div>
        
        <div style="margin-top:30px; color:#666; font-size:14px;">
            <strong>系统说明：</strong>
            <p>1. 先选择自己的名字，确保不会抽到自己</p>
            <p>2. 系统会从剩余人员中随机抽取</p>
            <p>3. 每人只能抽一次，抽过的名字会被标记</p>
        </div>
    </div>

    <script>
        // 完整的名字列表
        const allNames = [
            "张三", "李四", "王五", "赵六", 
            "钱七", "孙八", "周九", "吴十"
        ];
        
        let currentUser = "";
        let drawnPairs = JSON.parse(localStorage.getItem('drawnPairs') || '{}');
        
        // 初始化：填充选择框
        function init() {
            const select = document.getElementById('userSelect');
            select.innerHTML = '<option value="">-- 请选择你的名字 --</option>';
            
            // 只显示未被抽过的名字
            allNames.forEach(name => {
                if (!drawnPairs[name]) {
                    const option = document.createElement('option');
                    option.value = name;
                    option.textContent = name;
                    select.appendChild(option);
                }
            });
            
            updateAvailableList();
        }
        
        // 选择用户
        function selectUser() {
            const select = document.getElementById('userSelect');
            currentUser = select.value;
            
            if (!currentUser) {
                alert("请选择你的名字！");
                return;
            }
            
            // 如果这个用户已经抽过
            if (drawnPairs[currentUser]) {
                alert(`"${currentUser}" 已经抽过签了！`);
                return;
            }
            
            document.getElementById('currentUser').textContent = currentUser;
            document.getElementById('currentUser').className = 'name-tag current-user';
            
            // 切换到第二步
            document.getElementById('step1').classList.remove('active');
            document.getElementById('step2').classList.add('active');
            
            updateAvailableList();
        }
        
        // 更新可用名单（排除自己和已抽的人）
        function updateAvailableList() {
            const container = document.getElementById('availableList');
            container.innerHTML = '';
            
            const availableNames = allNames.filter(name => {
                // 排除自己
                if (name === currentUser) return false;
                // 排除已抽的人
                if (drawnPairs[name]) return false;
                return true;
            });
            
            if (availableNames.length === 0) {
                container.innerHTML = '<p style="color:#ff6b6b;">⚠️ 没有可抽取的人员！</p>';
                return;
            }
            
            availableNames.forEach(name => {
                const tag = document.createElement('span');
                tag.className = 'name-tag available';
                tag.textContent = name;
                container.appendChild(tag);
            });
        }
        
        // 开始抽签
        function startDraw() {
            const availableNames = allNames.filter(name => {
                if (name === currentUser) return false;
                if (drawnPairs[name]) return false;
                return true;
            });
            
            if (availableNames.length === 0) {
                alert("没有可抽取的人员！");
                return;
            }
            
            // 随机抽取
            const randomIndex = Math.floor(Math.random() * availableNames.length);
            const selected = availableNames[randomIndex];
            
            // 保存抽签结果
            drawnPairs[currentUser] = selected;
            localStorage.setItem('drawnPairs', JSON.stringify(drawnPairs));
            
            // 显示结果
            document.getElementById('result').innerHTML = `
                <p>🎉 恭喜 ${currentUser}！</p>
                <p>你抽到的是：</p>
                <div style="font-size: 48px; color: #ff4757; margin: 20px 0;">
                    ${selected}
                </div>
                <p>🎯 确保不会抽到自己！</p>
            `;
            
            // 切换到第三步
            document.getElementById('step2').classList.remove('active');
            document.getElementById('step3').classList.add('active');
        }
        
        // 下一个人抽签
        function resetForNext() {
            currentUser = "";
            document.getElementById('userSelect').value = "";
            document.getElementById('result').innerHTML = "";
            
            document.getElementById('step3').classList.remove('active');
            document.getElementById('step1').classList.add('active');
            
            init(); // 重新初始化
        }
        
        // 管理员功能
        function showAdminPanel() {
            document.getElementById('adminPanel').style.display = 'block';
        }
        
        function hideAdminPanel() {
            document.getElementById('adminPanel').style.display = 'none';
            document.getElementById('adminPassword').value = '';
        }
        
        function resetSystem() {
            const password = document.getElementById('adminPassword').value;
            if (password === "admin123") {
                if (confirm("确定重置整个系统吗？所有抽签记录将丢失！")) {
                    localStorage.removeItem('drawnPairs');
                    drawnPairs = {};
                    resetForNext();
                    alert("系统已重置！");
                    hideAdminPanel();
                }
            } else {
                alert("密码错误！");
            }
        }
        
        // 显示抽签历史（可选）
        function showHistory() {
            let history = "📜 抽签记录：\n\n";
            for (const user in drawnPairs) {
                history += `${user} → ${drawnPairs[user]}\n`;
            }
            alert(history || "暂无抽签记录");
        }
        
        // 页面加载时初始化
        window.onload = init;
        
        // 添加查看历史按钮（可选）
        document.addEventListener('DOMContentLoaded', function() {
            const historyBtn = document.createElement('button');
            historyBtn.textContent = '查看抽签记录';
            historyBtn.style.background = '#20c997';
            historyBtn.onclick = showHistory;
            document.querySelector('.container').appendChild(historyBtn);
        });
    </script>
</body>
</html>
