<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>轮盘抽签 - 排除已抽名字</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 500px;
            padding: 30px;
            text-align: center;
        }
        h1 {
            color: #333;
            margin-bottom: 20px;
            font-size: 24px;
        }
        
        /* 当前抽签人显示 */
        .current-user {
            background: #f1f8ff;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            border-left: 5px solid #6a11cb;
        }
        .current-user span {
            font-weight: bold;
            color: #6a11cb;
            font-size: 18px;
        }
        
        /* 轮盘 */
        .wheel-container {
            position: relative;
            width: 300px;
            height: 300px;
            margin: 20px auto;
        }
        #wheel {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: conic-gradient(
                #ff7676 0deg 90deg,
                #ffeaa7 90deg 180deg,
                #55efc4 180deg 270deg,
                #74b9ff 270deg 360deg
            );
            transition: transform 3s cubic-bezier(0.2, 0.8, 0.3, 1);
            cursor: pointer;
            position: relative;
        }
        .wheel-center {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 60px;
            height: 60px;
            background: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            border: 4px solid #6a11cb;
            box-shadow: 0 0 15px rgba(0,0,0,0.2);
        }
        .pointer {
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 20px solid transparent;
            border-right: 20px solid transparent;
            border-top: 30px solid #ff4757;
            z-index: 2;
        }
        
        /* 结果 */
        #result {
            margin: 25px 0;
            min-height: 100px;
        }
        #resultText {
            font-size: 28px;
            font-weight: bold;
            color: #2d3436;
            margin: 15px 0;
            min-height: 50px;
        }
        
        /* 按钮 */
        button {
            background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 16px;
            border-radius: 50px;
            cursor: pointer;
            margin: 8px;
            transition: all 0.3s;
        }
        button:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(106, 17, 203, 0.3); }
        button:disabled { background: #ccc; cursor: not-allowed; }
        .admin-btn { background: #ff4757; }
        
        /* 状态显示 */
        .status {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 10px;
            margin: 15px 0;
            font-size: 14px;
        }
        .remaining {
            color: #6a11cb;
            font-weight: bold;
            font-size: 18px;
        }
        
        /* 名字选择 */
        .name-selection {
            margin: 20px 0;
            padding: 15px;
            background: #f1f8ff;
            border-radius: 10px;
        }
        .name-option {
            display: inline-block;
            background: #6a11cb;
            color: white;
            padding: 8px 16px;
            margin: 5px;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .name-option:hover {
            background: #2575fc;
            transform: scale(1.05);
        }
        
        /* 隐藏/显示控制 */
        .hidden { display: none; }
        
        /* 烟花 */
        .firework {
            position: fixed;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            pointer-events: none;
            z-index: 1000;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 标题 -->
        <h1>🎡 轮盘抽签系统</h1>
        
        <!-- 当前抽签人显示 -->
        <div class="current-user hidden" id="currentUserDisplay">
            当前抽签人：<span id="currentUserName">未知</span>
        </div>
        
        <!-- 第一步：选择抽签人 -->
        <div id="selectUserSection">
            <div class="name-selection">
                <p style="margin-bottom: 10px;">请选择正在抽签的人：</p>
                <div id="userOptions">
                    <!-- 名字选项会动态生成 -->
                </div>
            </div>
            <button onclick="confirmUser()" id="confirmBtn">确认并开始抽签</button>
        </div>
        
        <!-- 第二步：轮盘抽签 -->
        <div id="lotterySection" class="hidden">
            <!-- 轮盘 -->
            <div class="wheel-container">
                <div class="pointer"></div>
                <div id="wheel" onclick="startSpin()">
                    <div class="wheel-center">点击抽签</div>
                </div>
            </div>
            
            <!-- 状态显示 -->
            <div class="status">
                <p>剩余可抽人数：<span class="remaining" id="remainingCount">0</span></p>
                <p style="font-size: 12px; color: #666; margin-top: 5px;">
                    *系统自动排除所有已抽中的名字
                </p>
            </div>
            
            <!-- 结果 -->
            <div id="result">
                <div id="resultText"></div>
            </div>
            
            <!-- 操作按钮 -->
            <div>
                <button onclick="startSpin()" id="spinBtn">开始抽签</button>
                <button onclick="nextUser()" id="nextBtn">下一个人抽签</button>
                <button onclick="showAdminPanel()" class="admin-btn">管理员重置</button>
            </div>
        </div>
        
        <!-- 管理员面板 -->
        <div id="adminPanel" class="hidden" style="margin-top: 20px; padding: 15px; background: #f8f9fa; border-radius: 10px;">
            <h3 style="color: #ff4757; margin-bottom: 10px;">系统重置</h3>
            <p>输入密码：admin123</p>
            <input type="password" id="resetPassword" 
                   style="padding: 8px; width: 180px; border: 2px solid #6a11cb; border-radius: 5px; margin: 10px 0;">
            <div>
                <button onclick="resetSystem()" style="background: #ff4757;">确认重置</button>
                <button onclick="hideAdminPanel()" style="background: #95a5a6;">取消</button>
            </div>
        </div>
        
        <!-- 使用说明 -->
        <div style="margin-top: 30px; color: #666; font-size: 14px; text-align: left;">
            <strong>💡 使用说明：</strong>
            <p>1. 先选择当前正在抽签的人（只是记录）</p>
            <p>2. 系统从<b>还没被抽到的人</b>中随机抽取</p>
            <p>3. 已抽中的名字自动排除，不会重复</p>
            <p>4. 理论上不会抽到自己（因为自己如果已被抽就不会在池中）</p>
        </div>
    </div>

    <script>
        // ============ 配置 ============
        const allNames = [
            "qiu", "jianhui", "peggie", "jiaxin", 
            "siowyao", "jingru", "xueyong",
        ];
        
        // ============ 变量 ============
        let currentUser = "";      // 当前抽签人
        let drawnNames = [];       // 已抽中的名字
        let availableNames = [];   // 可抽取的名字（排除已抽的）
        
        // ============ 初始化 ============
        window.onload = function() {
            loadData();
            renderUserOptions();
            updateRemainingCount();
        };
        
        function loadData() {
            drawnNames = JSON.parse(localStorage.getItem('drawnNames') || '[]');
            
            // 计算可抽取的名字（排除所有已抽中的）
            availableNames = allNames.filter(name => !drawnNames.includes(name));
            
            console.log("已抽中的名字:", drawnNames);
            console.log("可抽取的名字:", availableNames);
        }
        
        // 渲染抽签人选项
        function renderUserOptions() {
            const container = document.getElementById('userOptions');
            container.innerHTML = '';
            
            // 显示所有原始名单中的名字作为选项
            allNames.forEach(name => {
                const option = document.createElement('div');
                option.className = 'name-option';
                option.textContent = name;
                option.onclick = () => selectUser(name, option);
                container.appendChild(option);
            });
        }
        
        // 选择抽签人
        function selectUser(name, element) {
            // 移除其他选择
            document.querySelectorAll('.name-option').forEach(opt => {
                opt.style.background = '#6a11cb';
            });
            
            // 标记当前选择
            element.style.background = '#2575fc';
            currentUser = name;
            
            // 启用确认按钮
            document.getElementById('confirmBtn').disabled = false;
        }
        
        // 确认抽签人并开始
        function confirmUser() {
            if (!currentUser) {
                alert("请先选择抽签人！");
                return;
            }
            
            // 显示当前抽签人
            document.getElementById('currentUserName').textContent = currentUser;
            document.getElementById('currentUserDisplay').classList.remove('hidden');
            
            // 切换到抽签界面
            document.getElementById('selectUserSection').classList.add('hidden');
            document.getElementById('lotterySection').classList.remove('hidden');
            
            updateRemainingCount();
        }
        
        // 更新剩余人数显示
        function updateRemainingCount() {
            const count = availableNames.length;
            document.getElementById('remainingCount').textContent = count;
            
            if (count === 0) {
                document.getElementById('resultText').innerHTML = 
                    '<span style="color:#ff4757;">🎉 所有名字都已抽完！</span>';
            }
        }
        
        // ============ 抽签功能 ============
        function startSpin() {
            if (availableNames.length === 0) {
                alert("所有名字都已抽完！");
                return;
            }
            
            const wheel = document.getElementById('wheel');
            const spinBtn = document.getElementById('spinBtn');
            
            // 禁用按钮，开始动画
            spinBtn.disabled = true;
            spinBtn.textContent = '抽签中...';
            
            // 清空之前的结果
            document.getElementById('resultText').innerHTML = '';
            
            // 转盘旋转
            wheel.style.transform = 'rotate(1080deg)';
            
            // 3秒后显示结果
            setTimeout(() => {
                // 随机选择一个可抽取的名字
                const randomIndex = Math.floor(Math.random() * availableNames.length);
                const selectedName = availableNames[randomIndex];
                
                // 显示结果
                document.getElementById('resultText').innerHTML = `
                    <div style="font-size: 22px; color: #2d3436; margin-bottom: 8px;">
                        ${currentUser} 抽到：
                    </div>
                    <div style="font-size: 48px; color: #ff4757; font-weight: bold;">
                        ${selectedName}
                    </div>
                    <div style="font-size: 14px; color: #20c997; margin-top: 10px;">
                        ✅ 从剩余 ${availableNames.length} 人中抽取
                    </div>
                `;
                
                // 保存结果
                drawnNames.push(selectedName);
                localStorage.setItem('drawnNames', JSON.stringify(drawnNames));
                
                // 从可抽取名单中移除
                availableNames.splice(randomIndex, 1);
                
                // 更新按钮状态
                spinBtn.textContent = '已抽签';
                spinBtn.style.background = '#ccc';
                
                updateRemainingCount();
                createFireworks();
                
                // 检查是否抽到了自己（理论上不会发生，但做个验证）
                if (selectedName === currentUser) {
                    setTimeout(() => {
                        alert("⚠️ 注意：抽到了自己！这可能是数据错误。");
                    }, 1000);
                }
                
            }, 3000);
        }
        
        // 下一个人抽签
        function nextUser() {
            // 重置当前用户
            currentUser = "";
            
            // 重新加载数据（检查是否有新变化）
            loadData();
            
            // 切换回选择界面
            document.getElementById('lotterySection').classList.add('hidden');
            document.getElementById('selectUserSection').classList.remove('hidden');
            document.getElementById('currentUserDisplay').classList.add('hidden');
            
            // 重置轮盘
            document.getElementById('wheel').style.transform = 'rotate(0deg)';
            document.getElementById('spinBtn').disabled = false;
            document.getElementById('spinBtn').textContent = '开始抽签';
            document.getElementById('spinBtn').style.background = 'linear-gradient(135deg, #6a11cb 0%, #2575fc 100%)';
            
            // 重置选择
            document.querySelectorAll('.name-option').forEach(opt => {
                opt.style.background = '#6a11cb';
            });
            document.getElementById('confirmBtn').disabled = true;
            
            // 重新渲染选项
            renderUserOptions();
            updateRemainingCount();
            
            // 清空结果
            document.getElementById('resultText').innerHTML = '';
            
            alert("🔄 请下一位选择名字开始抽签！");
        }
        
        // ============ 管理员功能 ============
        function showAdminPanel() {
            document.getElementById('adminPanel').classList.remove('hidden');
        }
        
        function hideAdminPanel() {
            document.getElementById('adminPanel').classList.add('hidden');
            document.getElementById('resetPassword').value = '';
        }
        
        function resetSystem() {
            const password = document.getElementById('resetPassword').value;
            
            if (password === "admin123") {
                if (confirm("确定重置整个系统吗？所有抽签记录将被清除！")) {
                    // 清除所有数据
                    localStorage.removeItem('drawnNames');
                    
                    // 重置变量
                    drawnNames = [];
                    currentUser = "";
                    availableNames = [...allNames];
                    
                    // 重置界面
                    document.getElementById('lotterySection').classList.add('hidden');
                    document.getElementById('selectUserSection').classList.remove('hidden');
                    document.getElementById('currentUserDisplay').classList.add('hidden');
                    document.getElementById('adminPanel').classList.add('hidden');
                    
                    // 重置轮盘和按钮
                    document.getElementById('wheel').style.transform = 'rotate(0deg)';
                    document.getElementById('spinBtn').disabled = false;
                    document.getElementById('spinBtn').textContent = '开始抽签';
                    document.getElementById('spinBtn').style.background = 'linear-gradient(135deg, #6a11cb 0%, #2575fc 100%)';
                    
                    // 重置选择
                    document.querySelectorAll('.name-option').forEach(opt => {
                        opt.style.background = '#6a11cb';
                    });
                    document.getElementById('confirmBtn').disabled = true;
                    
                    // 重新渲染
                    renderUserOptions();
                    updateRemainingCount();
                    
                    // 清空结果
                    document.getElementById('resultText').innerHTML = '';
                    
                    alert("✅ 系统已重置！可以重新开始抽签。");
                }
            } else {
                alert("❌ 密码错误！");
                document.getElementById('resetPassword').value = '';
            }
        }
        
        // ============ 特效 ============
        function createFireworks() {
            const colors = ['#ff4757', '#2ed573', '#1e90ff', '#ffa502'];
            for (let i = 0; i < 10; i++) {
                setTimeout(() => {
                    const firework = document.createElement('div');
                    firework.className = 'firework';
                    firework.style.left = Math.random() * 100 + 'vw';
                    firework.style.top = Math.random() * 100 + 'vh';
                    firework.style.background = colors[Math.floor(Math.random() * colors.length)];
                    
                    document.body.appendChild(firework);
                    
                    firework.animate([
                        { opacity: 0, transform: 'scale(0)' },
                        { opacity: 1, transform: 'scale(1.5)' },
                        { opacity: 0, transform: 'scale(0)' }
                    ], { duration: 800 });
                    
                    setTimeout(() => firework.remove(), 800);
                }, i * 100);
            }
        }
        
        // ============ 辅助功能 ============
        // 查看当前状态（调试用）
        function showStatus() {
            console.log("当前状态:");
            console.log("- 所有名字:", allNames);
            console.log("- 已抽中的:", drawnNames);
            console.log("- 可抽取的:", availableNames);
            console.log("- 当前抽签人:", currentUser);
            
            let msg = "📊 当前状态：\n\n";
            msg += `总人数：${allNames.length}\n`;
            msg += `已抽中：${drawnNames.length}人\n`;
            msg += `可抽取：${availableNames.length}人\n`;
            msg += `当前抽签人：${currentUser || "未选择"}\n\n`;
            msg += `已抽中的名字：${drawnNames.join(', ') || "无"}`;
            
            alert(msg);
        }
        
        // 键盘快捷键
        document.addEventListener('keydown', function(e) {
            // Ctrl+Alt+S 查看状态
            if (e.ctrlKey && e.altKey && e.key === 's') {
                showStatus();
                e.preventDefault();
            }
            
            // Ctrl+Alt+R 显示重置面板
            if (e.ctrlKey && e.altKey && e.key === 'r') {
                showAdminPanel();
                e.preventDefault();
            }
        });
    </script>
</body>
    </html>
