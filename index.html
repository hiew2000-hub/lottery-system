<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>轮盘抽签系统</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 500px;
            padding: 30px;
            text-align: center;
        }
        h1 {
            color: #333;
            margin-bottom: 20px;
            font-size: 24px;
        }
        
        /* 当前抽签人 */
        .current-user {
            background: #e3f2fd;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            border: 2px solid #2196f3;
        }
        .current-user span {
            font-weight: bold;
            color: #1976d2;
            font-size: 20px;
        }
        
        /* 轮盘 */
        .wheel-container {
            position: relative;
            width: 300px;
            height: 300px;
            margin: 20px auto;
        }
        #wheel {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: conic-gradient(
                #ff7676 0deg 90deg,
                #ffeaa7 90deg 180deg,
                #55efc4 180deg 270deg,
                #74b9ff 270deg 360deg
            );
            transition: transform 3s cubic-bezier(0.2, 0.8, 0.3, 1);
            cursor: pointer;
            position: relative;
        }
        .wheel-center {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 60px;
            height: 60px;
            background: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            border: 4px solid #6a11cb;
            box-shadow: 0 0 15px rgba(0,0,0,0.2);
        }
        .pointer {
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 20px solid transparent;
            border-right: 20px solid transparent;
            border-top: 30px solid #ff4757;
            z-index: 2;
        }
        
        /* 状态信息 */
        .status-box {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 10px;
            margin: 15px 0;
        }
        .status-text {
            font-size: 16px;
            color: #666;
        }
        .status-number {
            font-weight: bold;
            color: #6a11cb;
            font-size: 24px;
        }
        
        /* 结果 */
        #result {
            margin: 25px 0;
            min-height: 120px;
        }
        #resultText {
            font-size: 28px;
            font-weight: bold;
            color: #2d3436;
            margin: 15px 0;
            min-height: 50px;
        }
        
        /* 按钮 - 统一样式 */
        .btn-confirm {
            background: linear-gradient(135deg, #00b09b, #96c93d);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 18px;
            border-radius: 50px;
            cursor: pointer;
            margin: 10px;
            transition: all 0.3s;
            display: inline-block;
            font-weight: bold;
            min-width: 200px;
        }
        .btn-confirm:hover { 
            transform: translateY(-3px); 
            box-shadow: 0 10px 20px rgba(0, 176, 155, 0.3); 
        }
        .btn-confirm:disabled { 
            background: #ccc; 
            cursor: not-allowed; 
            transform: none;
            box-shadow: none;
        }
        
        .btn-secondary {
            background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
            color: white;
            border: none;
            padding: 10px 25px;
            font-size: 16px;
            border-radius: 50px;
            cursor: pointer;
            margin: 8px;
            transition: all 0.3s;
        }
        .btn-secondary:hover { 
            transform: translateY(-2px); 
            box-shadow: 0 5px 15px rgba(106, 17, 203, 0.3); 
        }
        
        .btn-danger { 
            background: #ff4757; 
        }
        .btn-danger:hover { 
            box-shadow: 0 5px 15px rgba(255, 71, 87, 0.3); 
        }
        
        /* 名字选择 */
        .name-options {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            margin: 20px 0;
        }
        .name-option {
            background: #6a11cb;
            color: white;
            padding: 10px 20px;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s;
            min-width: 100px;
        }
        .name-option:hover {
            background: #2575fc;
            transform: scale(1.05);
        }
        .name-option.selected {
            background: #ff4757;
            transform: scale(1.1);
            box-shadow: 0 0 20px rgba(255, 71, 87, 0.5);
        }
        .name-option.taken {
            background: #95a5a6;
            cursor: not-allowed;
            opacity: 0.6;
        }
        
        /* 隐藏/显示 */
        .hidden { display: none !important; }
        
        /* 烟花 */
        .firework {
            position: fixed;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            pointer-events: none;
            z-index: 1000;
        }
        
        /* 完成提示 */
        .completion-message {
            background: #d4edda;
            color: #155724;
            padding: 15px;
            border-radius: 10px;
            margin: 15px 0;
            border: 1px solid #c3e6cb;
            font-size: 16px;
            font-weight: bold;
        }
        
        /* 步骤指示器 */
        .step-indicator {
            display: flex;
            justify-content: center;
            margin-bottom: 20px;
        }
        .step {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: #e9ecef;
            color: #666;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 10px;
            font-weight: bold;
        }
        .step.active {
            background: #6a11cb;
            color: white;
        }
        .step-line {
            width: 40px;
            height: 2px;
            background: #e9ecef;
            margin-top: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎡 轮盘抽签系统</h1>
        
        <!-- 步骤指示器 -->
        <div class="step-indicator">
            <div class="step" id="step1">1</div>
            <div class="step-line"></div>
            <div class="step" id="step2">2</div>
            <div class="step-line"></div>
            <div class="step" id="step3">3</div>
        </div>
        
        <!-- 当前抽签人 -->
        <div class="current-user hidden" id="currentUserDisplay">
            🧑‍💼 当前抽签人：<span id="currentUserName">未知</span>
        </div>
        
        <!-- 第一步：选择抽签人 -->
        <div id="selectUserSection">
            <h3>第一步：选择你的名字</h3>
            <p style="color: #666; margin-bottom: 15px;">请从下方选择你的名字</p>
            
            <div class="name-options" id="userOptions">
                <!-- 动态生成 -->
            </div>
            
            <button class="btn-confirm" onclick="confirmUser()" id="confirmBtn">
                ✅ 确认并开始抽签
            </button>
        </div>
        
        <!-- 第二步：抽签界面 -->
        <div id="lotterySection" class="hidden">
            <h3>第二步：开始抽签</h3>
            
            <!-- 状态信息 -->
            <div class="status-box">
                <p class="status-text">剩余可抽人数：<span class="status-number" id="remainingCount">0</span></p>
                <p style="font-size: 14px; color: #888; margin-top: 5px;">
                    *系统自动排除已抽中的人和你自己
                </p>
            </div>
            
            <!-- 轮盘 -->
            <div class="wheel-container">
                <div class="pointer"></div>
                <div id="wheel" onclick="startSpin()">
                    <div class="wheel-center">点击抽签</div>
                </div>
            </div>
            
            <!-- 结果 -->
            <div id="result">
                <div id="resultText"></div>
            </div>
            
            <!-- 操作按钮 -->
            <div>
                <button class="btn-secondary" onclick="startSpin()" id="spinBtn">开始抽签</button>
                <button class="btn-confirm" onclick="confirmResult()" id="resultBtn">
                    ✅ 确认结果
                </button>
                <button class="btn-secondary btn-danger" onclick="showAdminPanel()">管理员重置</button>
            </div>
        </div>
        
        <!-- 第三步：完成界面 -->
        <div id="completeSection" class="hidden">
            <h3>第三步：完成抽签</h3>
            
            <div class="completion-message" id="finalResult">
                <!-- 最终结果显示在这里 -->
            </div>
            
            <div style="margin: 20px 0;">
                <p style="color: #666; margin-bottom: 15px;">
                    🎉 抽签已完成！请下一位开始抽签。
                </p>
            </div>
            
            <button class="btn-confirm" onclick="nextUser()">
                🔄 下一个人开始抽签
            </button>
            
            <div style="margin-top: 15px;">
                <button class="btn-secondary" onclick="showAdminPanel()">管理员重置</button>
            </div>
        </div>
        
        <!-- 完成提示 -->
        <div id="allCompletionMessage" class="completion-message hidden">
            🎉 所有人员都已抽签完成！
        </div>
        
        <!-- 管理员面板 -->
        <div id="adminPanel" class="hidden" style="margin-top: 20px; padding: 15px; background: #f8f9fa; border-radius: 10px;">
            <h3 style="color: #ff4757; margin-bottom: 10px;">系统重置</h3>
            <input type="password" id="resetPassword" placeholder="输入密码：admin123"
                   style="padding: 8px; width: 200px; border: 2px solid #6a11cb; border-radius: 5px; margin: 10px 0;">
            <div>
                <button class="btn-secondary btn-danger" onclick="resetSystem()">确认重置</button>
                <button class="btn-secondary" onclick="hideAdminPanel()">取消</button>
            </div>
        </div>
        
        <!-- 使用说明 -->
        <div style="margin-top: 30px; color: #666; font-size: 14px; text-align: left;">
            <strong>📋 使用流程：</strong>
            <p>1. 选择名字 → 点击"✅ 确认并开始抽签"</p>
            <p>2. 点击轮盘抽签 → 查看结果</p>
            <p>3. 点击"✅ 确认结果" → 完成本次抽签</p>
            <p>4. 点击"🔄 下一个人开始抽签"让下一位继续</p>
        </div>
    </div>

    <script>
        // ============ 配置 ============
        const allNames = [
            "qiu", "jianhui", "peggie", "jiaxin", 
            "siowyao", "jingru", "xueyong"
        ];
        
        // ============ 变量 ============
        let currentUser = "";      // 当前抽签人
        let drawnNames = [];       // 已抽中的名字
        let lastResult = "";       // 最后一次抽签结果
        
        // ============ 初始化 ============
        window.onload = function() {
            loadData();
            renderUserOptions();
            updateStatus();
            updateStepIndicator(1);
        };
        
        function loadData() {
            drawnNames = JSON.parse(localStorage.getItem('drawnNames') || '[]');
        }
        
        // 获取可抽取名单（排除：已抽中的 + 自己）
        function getAvailableNames() {
            return allNames.filter(name => 
                !drawnNames.includes(name) && name !== currentUser
            );
        }
        
        // 渲染用户选项
        function renderUserOptions() {
            const container = document.getElementById('userOptions');
            container.innerHTML = '';
            
            // 检查是否所有人都已抽过
            const allTaken = allNames.every(name => drawnNames.includes(name));
            if (allTaken) {
                container.innerHTML = '<p style="color:#28a745; padding:20px;">🎉 所有人员都已抽签完成！</p>';
                document.getElementById('allCompletionMessage').classList.remove('hidden');
                document.getElementById('confirmBtn').disabled = true;
                return;
            }
            
            // 显示还未抽签的人
            allNames.forEach(name => {
                // 只显示还没抽过签的人
                if (!drawnNames.includes(name)) {
                    const option = document.createElement('div');
                    option.className = 'name-option';
                    option.textContent = name;
                    option.onclick = () => selectUser(name, option);
                    container.appendChild(option);
                }
            });
            
            // 如果当前用户已被抽过，清除选择
            if (currentUser && drawnNames.includes(currentUser)) {
                currentUser = "";
                document.getElementById('confirmBtn').disabled = true;
            }
        }
        
        // 选择用户
        function selectUser(name, element) {
            // 移除其他选择
            document.querySelectorAll('.name-option').forEach(opt => {
                opt.classList.remove('selected');
            });
            
            // 标记当前选择
            element.classList.add('selected');
            currentUser = name;
            
            // 启用确认按钮
            document.getElementById('confirmBtn').disabled = false;
        }
        
        // 步骤指示器
        function updateStepIndicator(step) {
            // 重置所有步骤
            document.getElementById('step1').classList.remove('active');
            document.getElementById('step2').classList.remove('active');
            document.getElementById('step3').classList.remove('active');
            
            // 激活当前步骤
            if (step >= 1) document.getElementById('step1').classList.add('active');
            if (step >= 2) document.getElementById('step2').classList.add('active');
            if (step >= 3) document.getElementById('step3').classList.add('active');
        }
        
        // 确认用户并开始
        function confirmUser() {
            if (!currentUser) {
                alert("请先选择你的名字！");
                return;
            }
            
            // 显示当前用户
            document.getElementById('currentUserName').textContent = currentUser;
            document.getElementById('currentUserDisplay').classList.remove('hidden');
            
            // 切换到抽签界面
            document.getElementById('selectUserSection').classList.add('hidden');
            document.getElementById('lotterySection').classList.remove('hidden');
            document.getElementById('completeSection').classList.add('hidden');
            document.getElementById('allCompletionMessage').classList.add('hidden');
            
            updateStepIndicator(2);
            updateStatus();
        }
        
        // 更新状态显示
        function updateStatus() {
            const availableNames = getAvailableNames();
            const availableCount = availableNames.length;
            
            document.getElementById('remainingCount').textContent = availableCount;
            
            // 如果没有可抽的人了（只剩自己）
            if (availableCount === 0) {
                document.getElementById('resultText').innerHTML = 
                    '<div style="color:#ff6b6b; font-size:20px; padding:20px;">🎉 你是最后一个！已无其他人可抽。</div>';
                document.getElementById('spinBtn').disabled = true;
            }
        }
        
        // ============ 抽签功能 ============
        function startSpin() {
            const availableNames = getAvailableNames();
            
            if (availableNames.length === 0) {
                alert("没有可抽取的人员！");
                return;
            }
            
            const wheel = document.getElementById('wheel');
            const spinBtn = document.getElementById('spinBtn');
            
            // 禁用按钮，开始动画
            spinBtn.disabled = true;
            spinBtn.textContent = '抽签中...';
            
            // 清空之前的结果
            document.getElementById('resultText').innerHTML = '';
            
            // 转盘旋转
            wheel.style.transform = 'rotate(1080deg)';
            
            // 3秒后显示结果
            setTimeout(() => {
                // 随机选择一个
                const randomIndex = Math.floor(Math.random() * availableNames.length);
                const selectedName = availableNames[randomIndex];
                
                // 保存最后结果
                lastResult = selectedName;
                
                // 显示结果
                document.getElementById('resultText').innerHTML = `
                    <div style="font-size: 22px; color: #2d3436; margin-bottom: 8px;">
                        🎯 抽签结果：
                    </div>
                    <div style="font-size: 48px; color: #ff4757; font-weight: bold;">
                        ${currentUser} → ${selectedName}
                    </div>
                    <div style="font-size: 14px; color: #20c997; margin-top: 10px;">
                        ✅ 点击下方"确认结果"按钮完成本次抽签
                    </div>
                `;
                
                // 更新按钮状态
                spinBtn.textContent = '开始抽签';
                spinBtn.disabled = false;
                
                // 验证绝对不会抽到自己
                if (selectedName === currentUser) {
                    setTimeout(() => {
                        alert("⚠️ 系统错误：抽到了自己！请重置系统。");
                    }, 1000);
                }
                
                createFireworks();
                
            }, 3000);
        }
        
        // 确认结果（新的确认按钮）
        function confirmResult() {
            if (!lastResult) {
                alert("请先进行抽签！");
                return;
            }
            
            // 保存到已抽名单
            drawnNames.push(lastResult);
            localStorage.setItem('drawnNames', JSON.stringify(drawnNames));
            
            // 显示最终结果
            document.getElementById('finalResult').innerHTML = `
                <div style="font-size: 20px; margin-bottom: 10px;">
                    🎉 抽签完成！
                </div>
                <div style="font-size: 32px; font-weight: bold;">
                    ${currentUser} 抽到了 ${lastResult}
                </div>
                <div style="font-size: 14px; margin-top: 10px; color: #0c5460;">
                    ✅ 结果已保存，请下一位开始抽签
                </div>
            `;
            
            // 切换到完成界面
            document.getElementById('lotterySection').classList.add('hidden');
            document.getElementById('completeSection').classList.remove('hidden');
            
            updateStepIndicator(3);
            
            // 显示确认提示
            alert(`✅ ${currentUser} 的抽签结果已确认！\n\n抽到了：${lastResult}`);
        }
        
        // 下一个人抽签
        function nextUser() {
            // 重置当前用户
            currentUser = "";
            lastResult = "";
            
            // 重新加载数据
            loadData();
            
            // 切换回选择界面
            document.getElementById('selectUserSection').classList.remove('hidden');
            document.getElementById('completeSection').classList.add('hidden');
            document.getElementById('currentUserDisplay').classList.add('hidden');
            document.getElementById('adminPanel').classList.add('hidden');
            
            // 重置轮盘
            document.getElementById('wheel').style.transform = 'rotate(0deg)';
            
            // 重置按钮状态
            const spinBtn = document.getElementById('spinBtn');
            spinBtn.disabled = false;
            spinBtn.textContent = '开始抽签';
            
            // 重置选择
            document.querySelectorAll('.name-option').forEach(opt => {
                opt.classList.remove('selected');
            });
            document.getElementById('confirmBtn').disabled = true;
            
            // 重新渲染选项
            renderUserOptions();
            updateStatus();
            
            // 清空结果
            document.getElementById('resultText').innerHTML = '';
            document.getElementById('finalResult').innerHTML = '';
            
            updateStepIndicator(1);
            
            // 显示提示
            alert("🔄 请下一位选择名字开始抽签！");
        }
        
        // ============ 管理员功能 ============
        function showAdminPanel() {
            document.getElementById('adminPanel').classList.remove('hidden');
        }
        
        function hideAdminPanel() {
            document.getElementById('adminPanel').classList.add('hidden');
            document.getElementById('resetPassword').value = '';
        }
        
        function resetSystem() {
            const password = document.getElementById('resetPassword').value;
            
            if (password === "admin123") {
                if (confirm("确定重置整个系统吗？所有抽签记录将被清除！")) {
                    // 清除所有数据
                    localStorage.removeItem('drawnNames');
                    
                    // 重置变量
                    drawnNames = [];
                    currentUser = "";
                    lastResult = "";
                    
                    // 重置界面
                    document.getElementById('selectUserSection').classList.remove('hidden');
                    document.getElementById('lotterySection').classList.add('hidden');
                    document.getElementById('completeSection').classList.add('hidden');
                    document.getElementById('currentUserDisplay').classList.add('hidden');
                    document.getElementById('adminPanel').classList.add('hidden');
                    document.getElementById('allCompletionMessage').classList.add('hidden');
                    
                    // 重置轮盘和按钮
                    document.getElementById('wheel').style.transform = 'rotate(0deg)';
                    const spinBtn = document.getElementById('spinBtn');
                    spinBtn.disabled = false;
                    spinBtn.textContent = '开始抽签';
                    
                    // 重置选择
                    document.querySelectorAll('.name-option').forEach(opt => {
                        opt.classList.remove('selected');
                    });
                    document.getElementById('confirmBtn').disabled = true;
                    
                    // 重新渲染
                    renderUserOptions();
                    updateStatus();
                    
                    // 清空结果
                    document.getElementById('resultText').innerHTML = '';
                    document.getElementById('finalResult').innerHTML = '';
                    
                    updateStepIndicator(1);
                    
                    alert("✅ 系统已重置！可以重新开始抽签。");
                }
            } else {
                alert("❌ 密码错误！");
                document.getElementById('resetPassword').value = '';
            }
        }
        
        // ============ 特效 ============
        function createFireworks() {
            const colors = ['#ff4757', '#2ed573', '#1e90ff', '#ffa502'];
            for (let i = 0; i < 10; i++) {
                setTimeout(() => {
                    const firework = document.createElement('div');
                    firework.className = 'firework';
                    firework.style.left = Math.random() * 100 + 'vw';
                    firework.style.top = Math.random() * 100 + 'vh';
                    firework.style.background = colors[Math.floor(Math.random() * colors.length)];
                    
                    document.body.appendChild(firework);
                    
                    firework.animate([
                        { opacity: 0, transform: 'scale(0)' },
                        { opacity: 1, transform: 'scale(1.5)' },
                        { opacity: 0, transform: 'scale(0)' }
                    ], { duration: 800 });
                    
                    setTimeout(() => firework.remove(), 800);
                }, i * 100);
            }
        }
        
        // ============ 键盘快捷键 ============
        document.addEventListener('keydown', function(e) {
            // Ctrl+Alt+R 显示重置面板
            if (e.ctrlKey && e.altKey && e.key === 'r') {
                showAdminPanel();
                e.preventDefault();
            }
            
            // ESC 隐藏所有面板
            if (e.key === 'Escape') {
                hideAdminPanel();
            }
        });
    </script>
</body>
</html>
